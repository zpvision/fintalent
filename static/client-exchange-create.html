<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Передать клиента — FinTalent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/client-exchange.css?v=1">
  <link rel="stylesheet" href="/static/wizard-step-progress.css?v=4">
  <link rel="stylesheet" href="/static/client-exchange-create.css?v=4">
</head>
<body>
  <header class="ce-header">
    <a href="/" class="ce-logo"><img src="/static/logo.png" alt="FinTalent"><span><b>FinTalent</b><small>биржа для бухгалтеров</small></span></a>
    <nav><a href="/client-exchange">Клиентская биржа</a><a href="/profile?section=client-exchange">Мои объявления</a></nav>
    <div class="ce-user"><a href="/profile">Профиль</a></div>
  </header>
  <main class="wizard-page">
    <header class="wizard-title">
      <a href="/client-exchange">← Вернуться в каталог</a>
      <span>ПЕРЕДАЧА КЛИЕНТА</span>
      <h1>Создайте карточку клиента</h1>
      <p>ИНН, название и контакты клиента не будут доступны в публичном каталоге.</p>
    </header>
    <div class="progress-head wizard-progress-head">
      <div class="wizard-progress-main">
        <div id="client-exchange-step-track" class="wizard-step-track" aria-label="Прогресс создания карточки клиента"></div>
        <div class="wizard-progress-copy"><b id="step-label">Шаг 1 из 6</b><strong>Создание карточки клиента</strong><span id="step-name">Основное</span></div>
      </div>
    </div>
    <section id="wizard-card" class="wizard-card"></section>
    <footer class="wizard-actions">
      <button class="ce-secondary" id="wizard-back">Назад</button>
      <button class="draft-button" id="save-draft">Сохранить черновик</button>
      <button class="ce-primary" id="wizard-next">Продолжить</button>
    </footer>
  </main>
  <div id="ce-toast" class="ce-toast"></div>
  <script src="/static/client-exchange-create.js?v=6"></script>
</body>
</html>
