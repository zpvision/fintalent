<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Редактор публикации — FinTalent</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/publication-editor.css?v=1"></head><body><header></header><main class="editor-page"><div class="editor-top"><a href="/publications">← Публикации</a><div class="editor-status"><i></i><span id="save-status">Новый черновик</span></div><div class="view-switch"><button data-view="editor" class="active">Редактор</button><button data-view="preview">Предпросмотр</button><button data-view="mobile">Мобильный вид</button></div><button id="publish-button" class="publish-button">Опубликовать</button></div>
<div class="editor-layout"><section class="editor-canvas"><div id="editor-mode"><label class="cover-upload" id="cover-drop"><input type="file" accept="image/png,image/jpeg,image/webp,image/gif"><span>▧</span><b>Добавить обложку</b><small>JPG, PNG или WebP · до 5 МБ</small></label><input id="publication-title" class="title-input" maxlength="240" placeholder="Заголовок публикации"><input id="publication-subtitle" class="subtitle-input" maxlength="300" placeholder="Подзаголовок"><textarea id="publication-excerpt" maxlength="800" placeholder="Краткое описание — оно появится в ленте и поиске"></textarea><div class="summary-editor"><header><div><b>За 30 секунд</b><small>Добавьте от 3 до 7 ключевых тезисов</small></div><button id="ai-summary" type="button">✦ Создать автоматически</button></header><div id="summary-items"></div><button id="add-summary" type="button">＋ Добавить тезис</button></div><div class="block-toolbar"><span>Добавить блок:</span><button data-type="paragraph">Абзац</button><button data-type="h2">H2</button><button data-type="h3">H3</button><button data-type="bullets">Список</button><button data-type="numbered">Нумерация</button><button data-type="quote">Цитата</button><button data-type="avoid">Как избежать</button><button data-type="note">Обратите внимание</button><button data-type="example">Пример</button><button data-type="conclusion">Вывод</button><button data-type="checklist">Чек-лист</button><button data-type="code">Код</button><button data-type="table">Таблица</button><button data-type="image">Изображение</button><button data-type="video">Видео</button><button data-type="divider">Разделитель</button></div><div id="content-blocks" class="content-blocks"></div></div><div id="preview-mode" class="preview-mode hidden"><div id="preview-device"><article id="publication-preview"></article></div></div></section>
<aside class="editor-settings"><h2>Настройки публикации</h2><label>Категория<select id="category"><option value="0">Выберите категорию</option></select></label><label>Темы<select id="topics" multiple></select></label><label>Теги<input id="tags" placeholder="УСН, налоги, отчётность"></label><label>Профессиональные навыки<select id="skills" multiple></select></label><label>Уровень<select id="difficulty"><option value="beginner">Начальный</option><option value="medium" selected>Средний</option><option value="advanced">Продвинутый</option><option value="expert">Экспертный</option></select></label><label>Время чтения<input id="reading-time" type="number" min="1" max="300" value="5"></label><label>Серия<select id="series"><option value="0">Без серии</option></select></label><label>Номер в серии<input id="series-order" type="number" min="1" value="1"></label><label>Связанный тест<select id="test"><option value="0">Без теста</option></select></label><label>Язык<select id="language"><option value="ru">Русский</option><option value="en">English</option></select></label><label>Видимость<select id="visibility"><option value="draft">Черновик</option><option value="public">Публичная</option><option value="unlisted">Только по ссылке</option></select></label><label class="check"><input id="allow-comments" type="checkbox" checked><span>Разрешить обсуждения</span></label><hr><label>URL slug<div class="slug-field"><input id="slug" placeholder="adres-publikacii"><i id="slug-state"></i></div></label><label>SEO-заголовок<input id="seo-title" maxlength="240"></label><label>SEO-описание<textarea id="seo-description" maxlength="320"></textarea></label><label>Что изменилось<input id="change-summary" maxlength="300" placeholder="Для новой версии"></label><div class="settings-actions"><button id="save-draft" class="secondary">Сохранить</button><button id="delete-publication" class="danger hidden">Удалить</button></div></aside></div></main><div id="editor-notice"></div><script src="/static/publication-editor.js?v=1"></script></body></html>
