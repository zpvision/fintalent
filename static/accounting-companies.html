<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Бухгалтерские компании — FinTalent</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/accounting-company.css?v=1"></head><body>
<header></header><main class="ac-page">
 <section class="ac-catalog-hero"><div><span class="ac-kicker">СООБЩЕСТВО FINTALENT</span><h1>Бухгалтерские компании</h1><p>Найдите команду с подходящей специализацией, понятными ценами и подтверждёнными компетенциями.</p></div><a class="ac-button" href="/accounting-companies/create">Создать страницу компании</a></section>
 <section class="ac-catalog-layout"><aside class="ac-filter-card"><div class="ac-filter-title"><h2>Фильтры</h2><button id="ac-reset">Сбросить</button></div><form id="ac-filters"><label><span>Поиск</span><input name="q" placeholder="Название или специализация"></label><label><span>Город</span><input name="city" placeholder="Любой город"></label><label><span>Направление</span><select name="direction_id"><option value="">Все направления</option></select></label><label><span>Услуга</span><select name="service_id"><option value="">Все услуги</option></select></label><label><span>Система налогообложения</span><select name="tax_system_id"><option value="">Любая</option></select></label><label><span>Стоимость услуг до</span><input name="price_to" type="number" min="0" placeholder="₽"></label><label class="ac-check"><input name="online" value="true" type="checkbox"><i></i><span>Работают по всей России</span></label><label class="ac-check"><input name="passport" value="true" type="checkbox"><i></i><span>Есть Паспорт компетенций</span></label></form></aside>
 <section class="ac-results"><div class="ac-results-head"><div><h2>Надёжная бухгалтерия для бизнеса</h2><p id="ac-found">Загрузка…</p></div><select id="ac-sort"><option value="new">Сначала новые</option></select></div><div id="ac-company-list" class="ac-company-grid"><div class="ac-skeleton"></div><div class="ac-skeleton"></div></div><nav id="ac-pagination" class="ac-pagination"></nav></section></section>
