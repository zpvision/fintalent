<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Разместить решение — ПрофиМаркет</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/profimarket.css?v=1">
  <style>
    #pm-create.pme-booting .pme-shell{visibility:hidden}
    .pme-startup-screen{position:fixed;z-index:2147483647;inset:0;display:grid;place-items:center;background:#f7f8fc;opacity:1;transition:opacity .18s ease}
    .pme-startup-screen.closing{opacity:0;pointer-events:none}
    .pme-startup-screen>div{display:grid;justify-items:center;gap:13px;color:#344461;font:600 13px Inter,Arial,sans-serif}
    .pme-startup-screen i{width:42px;height:42px;border:4px solid #dcebe6;border-top-color:#18a873;border-radius:50%;animation:pmeStartupSpin .7s linear infinite}
    .pme-startup-screen small{color:#7c8984;font-size:10px;font-weight:500}
    @keyframes pmeStartupSpin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <header></header>
  <main id="pm-create" class="pm-create-page"><div class="pm-loading">Загружаем редактор…</div></main>
  <div id="pm-modal"></div>
  <script src="/static/profimarket-style-presets.js?v=3"></script>
  <script src="/static/profimarket-components.js?v=27"></script>
  <script src="/static/profimarket-create.js?v=12"></script>
</body>
</html>
