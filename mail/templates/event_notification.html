<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <title>{{.Title}}</title>
</head>
<body style="margin:0;padding:0;background:#eef4ff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#10234c;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">{{.Intro}}</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="width:100%;background-color:#eef4ff;background-image:linear-gradient(135deg,#eaf3ff 0%,#f7f3ff 50%,#eaf8f3 100%);">
    <tr><td align="center" style="padding:38px 16px;">
      <table role="presentation" width="620" cellspacing="0" cellpadding="0" style="width:100%;max-width:620px;">
        <tr><td align="center" style="padding:0 0 22px;"><a href="https://fintalent.ru" style="display:inline-block;text-decoration:none;"><img src="cid:fintalent-logo" width="82" height="82" alt="FinTalent" style="display:block;width:82px;height:82px;border:0;border-radius:21px;box-shadow:0 10px 28px rgba(30,64,120,.16);"></a></td></tr>
        <tr><td style="overflow:hidden;border:1px solid #dfe8f5;border-radius:26px;background:#fff;box-shadow:0 18px 55px rgba(30,64,120,.12);">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
            <tr><td style="padding:32px 34px;background-color:#123d91;background-image:linear-gradient(125deg,#123d91 0%,{{.Accent}} 100%);color:#fff;">
              <div style="display:inline-block;padding:7px 12px;border:1px solid rgba(255,255,255,.28);border-radius:30px;background:rgba(255,255,255,.12);font-size:12px;line-height:16px;font-weight:700;">{{.Badge}}</div>
              <h1 style="margin:15px 0 0;font-size:27px;line-height:1.3;font-weight:750;">{{.Title}}</h1>
            </td></tr>
            <tr><td style="padding:31px 34px 34px;">
              <p style="margin:0 0 18px;font-size:16px;line-height:1.65;color:#263a5d;">Здравствуйте, {{.RecipientName}}!</p>
              <p style="margin:0 0 22px;font-size:15px;line-height:1.7;color:#566783;">{{.Intro}}</p>
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f8ff;border:1px solid #e1e9f7;border-radius:16px;"><tr><td style="padding:20px 22px;border-left:4px solid {{.Accent}};border-radius:16px;">
                <div style="font-size:11px;line-height:16px;color:#71809c;font-weight:800;letter-spacing:.6px;text-transform:uppercase;">{{.CardLabel}}</div>
                <div style="margin-top:7px;font-size:18px;line-height:25px;font-weight:750;color:#142b55;">{{.CardTitle}}</div>
                {{if .Details}}<div style="margin-top:9px;white-space:pre-line;font-size:14px;line-height:1.65;color:#52637f;">{{.Details}}</div>{{end}}
              </td></tr></table>
              <table role="presentation" cellspacing="0" cellpadding="0" style="margin-top:24px;"><tr><td style="border-radius:11px;background:{{.Accent}};"><a href="{{.ButtonURL}}" style="display:inline-block;padding:14px 21px;color:#fff;text-decoration:none;font-size:14px;line-height:18px;font-weight:750;">{{.ButtonText}} →</a></td></tr></table>
              {{if .Footer}}<p style="margin:23px 0 0;color:#8a96aa;font-size:12px;line-height:18px;">{{.Footer}}</p>{{end}}
            </td></tr>
          </table>
        </td></tr>
        <tr><td align="center" style="padding:20px 18px 0;color:#8491a8;font-size:12px;line-height:18px;">FinTalent · Платформа профессиональных возможностей</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
